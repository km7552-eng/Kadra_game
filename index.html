<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>City Hopper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>CITY <span>HOPPER</span></h1>
        <div class="tag">A rooftop platform adventure</div>
      </div>
      <div class="tag">HTML • CSS • JavaScript</div>
    </header>

    <section class="hud">
      <div class="stat"><small>Level</small><strong id="level">1 / 3</strong></div>
      <div class="stat"><small>Score</small><strong id="score">0</strong></div>
      <div class="stat"><small>Coins</small><strong id="coins">0</strong></div>
      <div class="stat"><small>Lives</small><strong id="lives">♥ ♥ ♥</strong></div>
    </section>

    <div class="game-wrap">
      <canvas id="game" width="960" height="540"
        tabindex="0" aria-label="City Hopper game area"></canvas>

      <div class="overlay" id="overlay">
        <div class="dialog">
          <h2 id="overlayTitle">CITY HOPPER</h2>
          <p id="overlayText">
            Jump across city rooftops, collect coins,
            avoid hazards, and reach the glowing exit.
            You have three lives!
          </p>
          <button id="startButton">START GAME</button>
        </div>
      </div>
    </div>

    <div class="mobile-controls">
      <button id="leftBtn">◀</button>
      <button id="rightBtn">▶</button>
      <button class="jump" id="jumpBtn">JUMP ↑</button>
    </div>

    <div class="help">
      <span>← → or A D = Move</span>
      <span>SPACE / W / ↑ = Jump</span>
      <span>P = Pause</span>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
